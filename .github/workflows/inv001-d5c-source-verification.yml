name: INV001 D5C source verification

on:
  pull_request:
    branches:
      - main
    paths:
      - src/lib/inventory/mobile/office-az-inventory-mobile-server.ts
      - src/lib/inventory/mobile/office-az-inventory-mobile-server.test.ts
      - src/lib/inventory/mobile/office-az-inventory-mobile-binding.ts
      - src/lib/inventory/mobile/office-az-inventory-mobile-binding.test.ts
      - src/lib/inventory/mobile/office-az-inventory-mobile-session-types.ts
      - src/lib/inventory/mobile/office-az-inventory-mobile-session-core.ts
      - src/lib/inventory/mobile/office-az-inventory-mobile-session-core.test.ts
      - src/app/api/inventory/mobile/session/route.test.ts
      - src/app/api/inventory/mobile/devices/route.test.ts
      - .github/workflows/inv001-d5c-source-verification.yml

permissions:
  contents: read
  packages: read

jobs:
  d5c-source-verification:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout exact pull request revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure run-scoped package read
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          npm_config_path="${RUNNER_TEMP}/inv001-d5c-source-npmrc"
          printf '%s\n' \
            '@nisikawa-officeaz:registry=https://npm.pkg.github.com' \
            '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' \
            'always-auth=true' > "$npm_config_path"
          test -f "$npm_config_path"
          grep -F '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' "$npm_config_path"
          ! grep -E 'gho_|github_pat_|ghp_|ghs_' "$npm_config_path"

      - name: Install locked dependencies without cache
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/inv001-d5c-source-npmrc
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm ci --no-audit --no-fund

      - name: Verify exact ten-path change set
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only --diff-filter=ACDMRTUXB "${{ github.event.pull_request.base.sha }}"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/inv001-d5c-source-verification.yml' \
            'src/app/api/inventory/mobile/devices/route.test.ts' \
            'src/app/api/inventory/mobile/session/route.test.ts' \
            'src/lib/inventory/mobile/office-az-inventory-mobile-binding.test.ts' \
            'src/lib/inventory/mobile/office-az-inventory-mobile-binding.ts' \
            'src/lib/inventory/mobile/office-az-inventory-mobile-server.test.ts' \
            'src/lib/inventory/mobile/office-az-inventory-mobile-server.ts' \
            'src/lib/inventory/mobile/office-az-inventory-mobile-session-core.test.ts' \
            'src/lib/inventory/mobile/office-az-inventory-mobile-session-core.ts' \
            'src/lib/inventory/mobile/office-az-inventory-mobile-session-types.ts' \
            | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD

      - name: Run focused D5C binding, session, and server tests
        run: >-
          node --experimental-test-module-mocks --import tsx --test
          src/lib/inventory/mobile/office-az-inventory-mobile-binding.test.ts
          src/lib/inventory/mobile/office-az-inventory-mobile-session-core.test.ts
          src/lib/inventory/mobile/office-az-inventory-mobile-server.test.ts

      - name: Run D5B persistence and D5A bearer regressions
        run: >-
          node --experimental-test-module-mocks --import tsx --test
          src/lib/inventory/mobile/office-az-inventory-mobile-persistence.test.ts
          src/lib/inventory/mobile/resolve-office-az-inventory-mobile-bearer.test.ts

      - name: Run authority regressions
        run: >-
          node --experimental-test-module-mocks --import tsx --test
          src/lib/inventory/authority/office-az-inventory-authority-core.test.ts
          src/lib/inventory/authority/office-az-inventory-authority-actions.test.ts
          src/lib/inventory/authority/office-az-inventory-authority-migration.test.ts
          src/lib/inventory/authority/resolve-office-az-inventory-authority.test.ts

      - name: Run mobile route tests
        run: >-
          node --experimental-test-module-mocks --import tsx --test
          src/app/api/inventory/mobile/session/route.test.ts
          src/app/api/inventory/mobile/devices/route.test.ts

      - name: Run typecheck
        run: npm run typecheck

      - name: Run build
        run: npm run build

      - name: Always delete temporary npm config and prove absence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npm_config_path="${RUNNER_TEMP}/inv001-d5c-source-npmrc"
          rm -f "$npm_config_path"
          test ! -e "$npm_config_path"
