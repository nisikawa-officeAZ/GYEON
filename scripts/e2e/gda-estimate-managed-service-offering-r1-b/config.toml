# GDA_ESTIMATE_MANAGED_SERVICE_OFFERING_R1_B_DISPOSABLE_TEMPLATE
# This file is copied into a fresh disposable runtime outside the repository
# worktree. It is never used as the repository's root Supabase configuration,
# never linked to a hosted project, and never applied against a shared or
# production database.

project_id = "__R1B_PROJECT_ID__"

[api]
enabled = true
port = __R1B_API_PORT__
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = __R1B_DB_PORT__
shadow_port = __R1B_SHADOW_PORT__
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = __R1B_STUDIO_PORT__
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = __R1B_INBUCKET_PORT__
smtp_port = __R1B_SMTP_PORT__
pop3_port = __R1B_POP3_PORT__

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:__R1B_APP_PORT__"
additional_redirect_urls = ["http://127.0.0.1:__R1B_APP_PORT__"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
