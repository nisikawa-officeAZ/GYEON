<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:20px 24px;background:var(--ds-bg);} .st{display:flex;align-items:center;gap:8px;} .n{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;border:1px solid var(--ds-line-slate);color:var(--ds-text-muted);background:var(--ds-bg-elevated);} .n.done{background:var(--ds-green-tint-15);border-color:rgba(34,197,94,0.35);color:var(--ds-green-400);} .n.cur{background:linear-gradient(135deg,#2563eb,#1d4ed8);border-color:#3b82f6;color:#fff;box-shadow:0 0 0 3px var(--ds-primary-tint-10);} .lbl{font-size:10px;letter-spacing:1.2px;font-weight:700;color:var(--ds-text-faint);} .lbl.cur{color:var(--ds-primary-400);} .cn{width:20px;height:1px;background:var(--ds-line);}</style></head><body>
