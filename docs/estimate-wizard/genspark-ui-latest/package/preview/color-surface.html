<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:20px 24px;background:var(--ds-bg);} .sw{display:flex;flex-direction:column;gap:4px;} .sc{width:100%;height:48px;border-radius:10px;border:1px solid var(--ds-line);} .lbl{font-size:10px;font-weight:600;letter-spacing:0.5px;color:var(--ds-text-muted);} .val{font-size:11px;color:var(--ds-text-primary);font-family:var(--ds-font-mono);}</style></head><body>
<div class="ds-overline" style="margin-bottom:12px;padding:0;">Surface / Background 階層</div>
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;">
  <div class="sw"><div class="sc" style="background:#080d1a;"></div><div class="lbl">bg (base)</div><div class="val">#080d1a</div></div>
  <div class="sw"><div class="sc" style="background:#0f172a;"></div><div class="lbl">bg-elevated</div><div class="val">#0f172a</div></div>
  <div class="sw"><div class="sc" style="background:#16161f;"></div><div class="lbl">bg-panel</div><div class="val">#16161f</div></div>
  <div class="sw"><div class="sc" style="background:#1e293b;"></div><div class="lbl">bg-card</div><div class="val">#1e293b</div></div>
  <div class="sw"><div class="sc" style="background:#1a1a24;"></div><div class="lbl">bg-card-2</div><div class="val">#1a1a24</div></div>
</div>
</body></html>
