<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:20px 24px;background:var(--ds-bg);}.bs{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;min-height:64px;background:var(--ds-bg-elevated);border:1px solid var(--ds-line-slate);border-radius:12px;position:relative;cursor:pointer;}.bs.sug{background:var(--ds-primary-tint-10);border-color:var(--ds-primary-tint-60);box-shadow:0 0 0 2px var(--ds-primary-tint-10);}.bs.sel{background:var(--ds-primary-tint-40);border-color:var(--ds-primary-tint-60);}.big{font-size:20px;font-weight:700;color:var(--ds-text-primary);line-height:1;}.big.sug{color:var(--ds-primary-300);}.big.sel{color:#fff;}.sub{font-size:9px;color:var(--ds-text-subtle);text-align:center;line-height:1.2;}.rec{position:absolute;top:5px;right:5px;font-size:8px;letter-spacing:0.5px;font-weight:700;color:var(--ds-primary-300);padding:1px 5px;background:var(--ds-primary-tint-10);border-radius:999px;border:1px solid var(--ds-primary-tint-60);}.chk{position:absolute;top:5px;right:5px;width:14px;height:14px;border-radius:50%;background:var(--ds-primary-500);display:grid;place-items:center;color:#fff;font-size:9px;}</style></head><body>
<div class="ds-overline" style="margin-bottom:12px;padding:0;">Binding · Body Size 7 ボタン (推奨→APU確定)</div>
<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;">
  <div class="bs"><div class="big">SS</div><div class="sub">軽 / コンパクト</div></div>
  <div class="bs"><div class="big">S</div><div class="sub">ミニバン小</div></div>
  <div class="bs sug"><span class="rec">推奨</span><div class="big sug">M</div><div class="sub">セダン標準</div></div>
  <div class="bs sel"><span class="chk">✓</span><div class="big sel">ML</div><div class="sub">SUV中</div></div>
  <div class="bs"><div class="big">L</div><div class="sub">SUV大</div></div>
  <div class="bs"><div class="big">LL</div><div class="sub">アルファード級</div></div>
  <div class="bs"><div class="big">XL</div><div class="sub">大型 / 特殊</div></div>
</div>
<div style="margin-top:12px;font-size:11px;color:var(--ds-text-muted);line-height:1.6;">
  3M計算で M を「推奨」ハイライト → APU が ML を最終確定 (自動確定はしない)
</div>
</body></html>
