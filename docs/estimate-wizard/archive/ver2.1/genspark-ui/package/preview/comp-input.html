<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:20px 24px;background:var(--ds-bg);} .lb{font-size:12px;font-weight:500;color:var(--ds-text-muted);margin-bottom:6px;display:flex;align-items:center;gap:4px;} .in{width:100%;min-height:44px;background:var(--ds-bg-elevated);border:1px solid var(--ds-line-slate);border-radius:10px;padding:10px 14px;color:var(--ds-text-primary);font-size:14px;font-family:var(--ds-font-sans);outline:none;} .req{color:var(--ds-amber-400);font-weight:700;}</style></head><body>
<div class="ds-overline" style="margin-bottom:12px;padding:0;">Input — 通常 / 必須未入力 (Amber) / Focus</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;">
  <div>
    <div class="lb">お客様名</div>
    <input class="in" value="山田太郎" />
    <div style="font-size:11px;color:var(--ds-text-subtle);margin-top:4px;">入力済み → 通常</div>
  </div>
  <div>
    <div class="lb" style="color:var(--ds-amber-400);">お客様名 <span class="req">*</span></div>
    <input class="in" placeholder="必須項目" style="border-color:var(--ds-amber-tint-40);box-shadow:var(--ds-glow-amber);"/>
    <div style="font-size:11px;color:var(--ds-amber-400);margin-top:4px;">必須未入力 → Amber (入力で解除)</div>
  </div>
  <div>
    <div class="lb">住所</div>
    <input class="in" value="滋賀県大津市浜大津1-1-1" style="border-color:var(--ds-primary-700);box-shadow:var(--ds-glow-primary);"/>
    <div style="font-size:11px;color:var(--ds-primary-300);margin-top:4px;">Focus → Primary Ring</div>
  </div>
</div>
</body></html>
