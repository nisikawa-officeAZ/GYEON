<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:20px 24px;background:var(--ds-bg);}</style></head><body>
<div class="ds-overline" style="margin-bottom:12px;padding:0;">Sticky Total Panel — 常設合計</div>
<div style="max-width:320px;background:var(--ds-bg-card);border:1px solid var(--ds-line);border-radius:14px;padding:18px;box-shadow:var(--ds-shadow-lg), var(--ds-hi-inner);">
  <div style="font-size:10px;font-weight:700;letter-spacing:1.4px;color:var(--ds-text-subtle);text-transform:uppercase;margin-bottom:10px;">お見積合計</div>
  <div style="display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ds-text-muted);">
    <div style="display:flex;justify-content:space-between;"><span>コーティング</span><span class="ds-numeric" style="color:var(--ds-text-body);">¥180,000</span></div>
    <div style="display:flex;justify-content:space-between;"><span>PPF</span><span class="ds-numeric" style="color:var(--ds-text-body);">¥45,454</span></div>
    <div style="display:flex;justify-content:space-between;"><span>オプション</span><span class="ds-numeric" style="color:var(--ds-text-body);">¥28,000</span></div>
  </div>
  <div style="height:1px;background:var(--ds-line);margin:12px 0;"></div>
  <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ds-text-muted);"><span>小計</span><span class="ds-numeric" style="color:var(--ds-text-body);">¥253,454</span></div>
  <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ds-amber-400);"><span>値引き</span><span class="ds-numeric">− ¥5,000</span></div>
  <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ds-text-muted);"><span>消費税 (10%)</span><span class="ds-numeric" style="color:var(--ds-text-body);">¥24,845</span></div>
  <div style="height:1px;background:var(--ds-line-strong);margin:10px 0;"></div>
  <div style="display:flex;justify-content:space-between;align-items:baseline;">
    <span style="font-size:10px;font-weight:700;letter-spacing:1.4px;color:var(--ds-text-body);text-transform:uppercase;">合計</span>
    <span class="ds-price-total" style="color:var(--ds-text-strong);">¥273,299</span>
  </div>
</div>
</body></html>
