<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:20px 24px;background:var(--ds-bg);} .btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--ds-font-sans);}</style></head><body>
<div class="ds-overline" style="margin-bottom:12px;padding:0;">Buttons — Primary / Secondary / Ghost / LINE</div>
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
  <button class="btn" style="background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 100%);color:#fff;border:1px solid #1d4ed8;">保存</button>
  <button class="btn" style="background:var(--ds-bg-elevated);color:var(--ds-text-primary);border:1px solid var(--ds-line-slate);font-weight:500;">PDF 出力</button>
  <button class="btn" style="background:transparent;color:var(--ds-text-muted);border:1px solid transparent;font-weight:500;">キャンセル</button>
  <button class="btn" style="background:transparent;color:var(--ds-primary-300);border:1px solid var(--ds-primary-tint-60);font-weight:500;">QR</button>
  <button class="btn" style="background:transparent;color:var(--ds-red-400);border:1px solid var(--ds-red-tint-30);font-weight:500;">削除</button>
  <button class="btn" style="background:var(--ds-line-brand);color:#fff;border:1px solid var(--ds-line-brand);">LINE 送信</button>
</div>
<div style="margin-top:12px;font-size:11px;color:var(--ds-text-subtle);">全ボタン最小 44×44px (タップ最小 48×48px は SelectButton で確保)</div>
</body></html>
