<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:20px 24px;background:var(--ds-bg);} .sw{display:flex;flex-direction:column;gap:4px;} .sc{width:100%;height:48px;border-radius:10px;} .lbl{font-size:10px;font-weight:600;letter-spacing:0.5px;color:var(--ds-text-muted);} .val{font-size:11px;color:var(--ds-text-primary);font-family:var(--ds-font-mono);}</style></head><body>
<div class="ds-overline" style="margin-bottom:12px;padding:0;">Primary (Brand Blue)</div>
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;">

  <div class="sw"><div class="sc" style="background:#1d4ed8;"></div><div class="lbl">700 primary</div><div class="val">#1d4ed8</div></div>
  <div class="sw"><div class="sc" style="background:#2563eb;"></div><div class="lbl">600</div><div class="val">#2563eb</div></div>
  <div class="sw"><div class="sc" style="background:#3b82f6;"></div><div class="lbl">500</div><div class="val">#3b82f6</div></div>
  <div class="sw"><div class="sc" style="background:#4f8ef7;"></div><div class="lbl">400</div><div class="val">#4f8ef7</div></div>
  <div class="sw"><div class="sc" style="background:#93c5fd;"></div><div class="lbl">200</div><div class="val">#93c5fd</div></div>
</div>
</body></html>
