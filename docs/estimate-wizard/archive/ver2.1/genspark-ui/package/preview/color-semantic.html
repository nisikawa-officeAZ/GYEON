<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:20px 24px;background:var(--ds-bg);} .card{padding:12px 14px;border-radius:12px;font-size:13px;display:flex;align-items:center;gap:10px;font-weight:500;}</style></head><body>
<div class="ds-overline" style="margin-bottom:12px;padding:0;">Semantic — Amber / Green / Red / LINE</div>
<div style="display:flex;flex-direction:column;gap:8px;">
  <div class="card" style="background:var(--ds-amber-tint-10);border:1px solid var(--ds-amber-tint-40);color:var(--ds-amber-400);">
    <span style="width:10px;height:10px;border-radius:50%;background:var(--ds-amber-400);"></span>
    <strong>Amber #fbbf24</strong> · 必須未入力ハイライト (入力完了で解除)
  </div>
  <div class="card" style="background:var(--ds-green-tint-15);border:1px solid rgba(34,197,94,0.35);color:var(--ds-green-400);">
    <span style="width:10px;height:10px;border-radius:50%;background:var(--ds-green-500);"></span>
    <strong>Green #22c55e</strong> · 成功 / 保存済み / 選択確定
  </div>
  <div class="card" style="background:var(--ds-red-tint-10);border:1px solid var(--ds-red-tint-30);color:var(--ds-red-400);">
    <span style="width:10px;height:10px;border-radius:50%;background:var(--ds-red-500);"></span>
    <strong>Red #ef4444</strong> · エラー / 破壊操作
  </div>
  <div class="card" style="background:var(--ds-line-brand);border:1px solid var(--ds-line-brand);color:#fff;">
    <span style="width:10px;height:10px;border-radius:50%;background:#fff;"></span>
    <strong>LINE #06c755</strong> · LINE Business ブランド (Screen7 通信ボタン)
  </div>
</div>
</body></html>
