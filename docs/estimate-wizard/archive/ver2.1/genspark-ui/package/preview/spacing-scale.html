<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:20px 24px;background:var(--ds-bg);} .row{display:flex;align-items:center;gap:12px;} .bar{background:var(--ds-primary-500);height:8px;border-radius:2px;} .lbl{font-size:11px;color:var(--ds-text-muted);width:60px;font-family:var(--ds-font-mono);}</style></head><body>
<div class="ds-overline" style="margin-bottom:12px;padding:0;">Spacing — 4px baseline</div>
<div style="display:flex;flex-direction:column;gap:8px;">
  <div class="row"><span class="lbl">1 · 4px</span><div class="bar" style="width:4px;"></div></div>
  <div class="row"><span class="lbl">2 · 8px</span><div class="bar" style="width:8px;"></div></div>
  <div class="row"><span class="lbl">3 · 12px</span><div class="bar" style="width:12px;"></div></div>
  <div class="row"><span class="lbl">4 · 16px</span><div class="bar" style="width:16px;"></div></div>
  <div class="row"><span class="lbl">5 · 20px</span><div class="bar" style="width:20px;"></div></div>
  <div class="row"><span class="lbl">6 · 24px</span><div class="bar" style="width:24px;"></div></div>
  <div class="row"><span class="lbl">8 · 32px</span><div class="bar" style="width:32px;"></div></div>
  <div class="row"><span class="lbl">12 · 48px</span><div class="bar" style="width:48px;"></div></div>
</div>
</body></html>
