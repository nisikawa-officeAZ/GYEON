<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script><style>body{margin:0;padding:20px 24px;background:var(--ds-bg);}.ic{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;background:var(--ds-bg-elevated);border:1px solid var(--ds-line);border-radius:10px;color:var(--ds-text-body);}.ic i{width:20px;height:20px;}.lb{font-size:9px;color:var(--ds-text-subtle);}</style></head><body>
<div class="ds-overline" style="margin-bottom:12px;padding:0;">Iconography · Lucide (stroke 1.75)</div>
<div style="display:grid;grid-template-columns:repeat(9,1fr);gap:6px;">
  <div class="ic"><i data-lucide="user"></i><div class="lb">user</div></div>
  <div class="ic"><i data-lucide="car"></i><div class="lb">car</div></div>
  <div class="ic"><i data-lucide="sparkles"></i><div class="lb">sparkles</div></div>
  <div class="ic"><i data-lucide="receipt"></i><div class="lb">receipt</div></div>
  <div class="ic"><i data-lucide="tag"></i><div class="lb">tag</div></div>
  <div class="ic"><i data-lucide="notepad-text"></i><div class="lb">notes</div></div>
  <div class="ic"><i data-lucide="check-circle-2"></i><div class="lb">confirm</div></div>
  <div class="ic"><i data-lucide="save"></i><div class="lb">save</div></div>
  <div class="ic"><i data-lucide="file-text"></i><div class="lb">pdf</div></div>
  <div class="ic"><i data-lucide="scan-line"></i><div class="lb">OCR</div></div>
  <div class="ic"><i data-lucide="qr-code"></i><div class="lb">QR</div></div>
  <div class="ic"><i data-lucide="calendar"></i><div class="lb">reserve</div></div>
  <div class="ic"><i data-lucide="truck"></i><div class="lb">delivery</div></div>
  <div class="ic"><i data-lucide="plus"></i><div class="lb">add</div></div>
  <div class="ic"><i data-lucide="trash-2"></i><div class="lb">delete</div></div>
  <div class="ic"><i data-lucide="pencil"></i><div class="lb">edit</div></div>
  <div class="ic"><i data-lucide="alert-triangle"></i><div class="lb">warn</div></div>
  <div class="ic"><i data-lucide="loader-2"></i><div class="lb">loading</div></div>
</div>
<script>lucide.createIcons();</script>
</body></html>
